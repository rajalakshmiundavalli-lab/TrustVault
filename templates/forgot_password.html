<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password | TrustVault</title>
    <style>
    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f4f7fb;
    }

    .card {
        background: white;
        width: 90%;
        max-width: 420px;
        padding: 35px;
        border-radius: 14px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h2 {
        color: #102a43;
        text-align: center;
    }

    p {
        color: #64748b;
        line-height: 1.5;
    }

    input {
        width: 100%;
        padding: 12px;
        margin: 12px 0 18px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
    }

    button {
        width: 100%;
        padding: 13px;
        background: #102a43;
        color: white;
        border: none;
        border-radius: 7px;
        cursor: pointer;
    }

    a {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #1d4ed8;
        text-decoration: none;
    }
</style>
</head>
<body>
    <div class="card">
        <h2>Reset Your Password</h2>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label>Registered Email:</label>
        <input type="email" name="email" required>

        <button type="submit">Send Reset Link</button>
    </form>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <a href="{{ url_for('login') }}">Back to Login</a>
</body>
</html>
