
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrustVault | Change Password</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6fb;
            color: #17233d;
        }

        .container {
            max-width: 520px;
            margin: 70px auto;
            padding: 35px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 3px 20px rgba(0,0,0,0.05);
        }

        h1 {
            color: #19376d;
            margin-bottom: 10px;
            font-size: 27px;
        }

        .subtitle {
            color: #718096;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #dce2ec;
            border-radius: 7px;
            margin-bottom: 20px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2456a6;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #19376d;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #2456a6;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #2456a6;
            text-decoration: none;
            font-weight: bold;
        }

        .message {
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 18px;
            background: #fff0f0;
            color: #b42318;
            font-size: 14px;
        }

        .success {
            background: #e8f7ed;
            color: #267343;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Change Password</h1>

    <p class="subtitle">
        Update your TrustVault account password securely.
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="message {% if category == 'success' %}success{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('change_password') }}">

        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token() }}">

        <label>Current Password</label>
        <input type="password"
               name="current_password"
               required>

        <label>New Password</label>
        <input type="password"
               name="new_password"
               minlength="8"
               required>

        <label>Confirm New Password</label>
        <input type="password"
               name="confirm_password"
               minlength="8"
               required>

        <button type="submit">Update Password</button>

    </form>

    <a href="{{ url_for('dashboard') }}" class="back">
        Back to Dashboard
    </a>

</div>

</body>
</html>
